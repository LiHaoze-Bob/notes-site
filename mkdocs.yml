site_name: sychostar
site_description: 浙江大学 CS 本科生的课程笔记、知识积累与阅读记录。
site_author: sychostar
site_url: https://lihaoze-bob.github.io/notes-site/
repo_name: LiHaoze-Bob/notes-site
repo_url: https://github.com/LiHaoze-Bob/notes-site
edit_uri: ''
theme:
  custom_dir: site-template/overrides
  variant: classic
  language: zh
  font: false
  icon:
    logo: material/notebook-outline
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: 切换至深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: 切换至浅色模式
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - toc.follow
  - content.code.copy
  - search.highlight
markdown_extensions:
- admonition
- attr_list
- tables
- footnotes
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.arithmatex:
    generic: true
    smart_dollar: false
- pymdownx.tasklist:
    custom_checkbox: true
- toc:
    permalink: true
extra_css:
- assets/stylesheets/site.css
extra_javascript:
- assets/javascripts/mathjax-config.js
- assets/vendor/mathjax/tex-mml-chtml.js
extra:
  generator: false
copyright: © 2026 sychostar
nav:
- Home: index.md
- Courses:
  - courses/index.md
  - 深度学习:
    - courses/DL-ZJU/index.md
    - Lecture3 卷积神经网络CNN: courses/DL-ZJU/Lecture3 卷积神经网络CNN.md
    - Lecture4 提升CNN的准确性: courses/DL-ZJU/Lecture4 提升CNN的准确性.md
- Knowledge:
  - knowledge/index.md
- Reading:
  - reading/index.md
